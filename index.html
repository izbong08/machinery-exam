function draw(pool,count){
  const shuffled=pool.slice();
  for(let i=0;i<count;i++){
    const j=i+Math.floor(Math.random()*(shuffled.length-i));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  return shuffled.slice(0,count);
}
function startExam(){
  const list=document.getElementById('questions');
  list.replaceChildren();
  for(const [subject,pool,count] of [['엔진',engine,3],['전기',electric,2],['차체',chassis,4],['차체 필수',required,1]]){
    for(const question of draw(pool,count)){
      const item=document.createElement('li');
      const number=document.createElement('span');
      number.textContent=String(list.children.length+1).padStart(2,'0');
      const content=document.createElement('div');
      const label=document.createElement('b');
      label.textContent=subject;
      const prompt=document.createElement('p');
      prompt.textContent=question;
      content.append(label,prompt);
      item.append(number,content);
      list.append(item);
    }
  }
  document.getElementById('intro').hidden=true;
  document.getElementById('exam').hidden=false;
  document.getElementById('heading').focus({preventScroll:true});
  window.scrollTo(0,0);
}
const allChassis = [required[0], chassis[0], ...required.slice(1), ...chassis.slice(1)];
function showCatalog(){
  const subjects = document.getElementById('subjects');
  if (!subjects.children.length) {
    for (const [name, questions] of [['엔진', engine], ['전기', electric], ['차체', allChassis]]) {
      const heading = document.createElement('h3');
      heading.textContent = name + ' · ' + questions.length + '문제';
      const list = document.createElement('ol');
      questions.forEach((question, index) => {
        const item = document.createElement('li');
        const number = document.createElement('span');
        number.textContent = String(index + 1).padStart(2, '0');
        const prompt = document.createElement('p');
        prompt.textContent = question;
        const content = document.createElement('div');
        content.append(prompt);
        const source = document.getElementById('note-' + name + '-' + (index + 1));
        const text = source.textContent.trim();
        if (text) {
          const note = document.createElement('aside');
          note.className = 'study-note';
          const title = document.createElement('b');
          title.textContent = source.dataset.label;
          const body = document.createElement('div');
          body.className = 'note-text';
          body.textContent = text;
          note.append(title, body);
          content.append(note);
        }
        item.append(number, content);
        list.append(item);
      });
      subjects.append(heading, list);
    }
  }
  document.getElementById('intro').hidden = true;
  document.getElementById('catalog').hidden = false;
  document.getElementById('catalog-title').focus({preventScroll:true});
  window.scrollTo(0, 0);
}
document.getElementById('browse').addEventListener('click', showCatalog);
function returnHome(view, trigger) {
  document.getElementById(view).hidden = true;
  document.getElementById('intro').hidden = false;
  document.getElementById(trigger).focus({preventScroll:true});
  window.scrollTo(0, 0);
}
document.getElementById('back').addEventListener('click', () => returnHome('catalog', 'browse'));
